        body {

            padding: 0 16px;
            color: var(--subtext0);
            text-decoration: none;
            transition: color 0.15s, background 0.15s;

        nav a.active {
            color: var(--text);
            background: var(--base);
            border-bottom: 1px solid var(--base);
            margin-bottom: -1px;
        }
        .page {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 2rem;
            gap: 1.5rem;

        .hero {

            border: 1px solid var(--surface0);

            color: var(--subtext0);

        .divider {
            width: 100%;
            max-width: 480px;
            height: 1px;
            background: var(--surface0);
        }
        .social-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }
        .social-links a {
            color: var(--overlay1);
            transition: color 0.2s, transform 0.15s;
            display: flex;
        }
        .social-links a:hover {
            color: var(--blue);
            transform: translateY(-1px);
        }
        .social-links svg {

        .bio {

            line-height: 1.6;
        }
        footer {

            border-top: 1px solid var(--surface0);
            flex-shrink: 0;
        }
        footer a { color: var(--blue); text-decoration: none; }
        footer a:hover { text-decoration: underline; }
        @media (max-width: 640px) {
            canvas { width: 240px !important; height: 240px !important; }

    <script>
        const canvas = document.getElementById('robotCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        const BASE_X = 24, BASE_Y = 112, L1 = 40, L2 = 36;

        const C_BG = '#0a0a0c', C_GRID = '#151518';
        const C_ARM_HL = '#FFE347', C_ARM = '#E6BC00', C_ARM_SH = '#B39100';
        const C_JOINT = '#E0E0E0';
        const C_BASE_1 = '#2A2A2E', C_BASE_2 = '#1A1A1D';
        const C_BLOCK_HL = '#F17C67', C_BLOCK = '#E74C3C', C_BLOCK_SH = '#C0392B';
        const C_FLOOR = '#111115';
        const C_VLA_TEXT = '#00FF41';

        let time = 0;
        let instructionText = '> SYS_INIT';

        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function drawSegment(x1, y1, x2, y2) {
            ctx.strokeStyle = C_ARM_SH; ctx.lineWidth = 6; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(x1, y1 + 1); ctx.lineTo(x2, y2 + 1); ctx.stroke();
            ctx.strokeStyle = C_ARM; ctx.lineWidth = 5;
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
            ctx.strokeStyle = C_ARM_HL; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(x1, y1 - 1); ctx.lineTo(x2, y2 - 1); ctx.stroke();
        }

        function drawJoint(x, y, size) {
            ctx.fillStyle = C_BASE_2;
            ctx.fillRect(Math.floor(x - size/2) - 1, Math.floor(y - size/2) - 1, size + 2, size + 2);
            ctx.fillStyle = C_JOINT;
            ctx.fillRect(Math.floor(x - size/2), Math.floor(y - size/2), size, size);
            ctx.fillStyle = '#666';
            ctx.fillRect(Math.floor(x) - 1, Math.floor(y) - 1, 2, 2);
        }

        function solveIK(targetX, targetY) {
            let dx = targetX - BASE_X, dy = targetY - BASE_Y;
            let dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > L1 + L2 - 0.1) {
                let ratio = (L1 + L2 - 0.1) / dist;
                dx *= ratio; dy *= ratio; dist = L1 + L2 - 0.1;
            }
            let cosT2 = (dist * dist - L1 * L1 - L2 * L2) / (2 * L1 * L2);
            cosT2 = Math.max(-1, Math.min(1, cosT2));
            let theta2 = Math.acos(cosT2);
            let theta1 = Math.atan2(dy, dx) - Math.atan2(L2 * Math.sin(theta2), L1 + L2 * Math.cos(theta2));
            return {
                j1x: BASE_X + L1 * Math.cos(theta1),
                j1y: BASE_Y + L1 * Math.sin(theta1),
                j2x: BASE_X + L1 * Math.cos(theta1) + L2 * Math.cos(theta1 + theta2),
                j2y: BASE_Y + L1 * Math.sin(theta1) + L2 * Math.sin(theta1 + theta2),
                theta1, theta2
            };
        }

        function drawFrame(t) {
            ctx.fillStyle = C_BG;
            ctx.fillRect(0, 0, 128, 128);
            ctx.strokeStyle = C_GRID; ctx.lineWidth = 1;
            for (let i = 0; i < 128; i += 16) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 128); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(128, i); ctx.stroke();
            }
            ctx.fillStyle = C_FLOOR;
            ctx.fillRect(0, 114, 128, 14);
            ctx.strokeStyle = '#333'; ctx.setLineDash([2, 2]);
            ctx.strokeRect(41, 104, 14, 10); ctx.setLineDash([]);

            let cycle = t % 500;
            let targetX = 56, targetY = 60, clawOpen = 1;
            let blockX = 91, blockY = 106, holding = false;

            const pIdle = {x: 56, y: 60}, pAboveBlock = {x: 96, y: 70};
            const pBlock = {x: 96, y: 96}, pAboveDrop = {x: 48, y: 70}, pDrop = {x: 48, y: 96};

            if (cycle < 40) {
                targetX = pIdle.x; targetY = pIdle.y;
                instructionText = '> OBS: DETECTING SCENE...';
            } else if (cycle < 90) {
                let p = easeInOutCubic((cycle - 40) / 50);
                targetX = pIdle.x + (pAboveBlock.x - pIdle.x) * p;
                targetY = pIdle.y + (pAboveBlock.y - pIdle.y) * p;
                instructionText = '> ACT: TARGET RED_BLOCK';
            } else if (cycle < 120) {
                let p = easeInOutCubic((cycle - 90) / 30);
                targetX = pAboveBlock.x;
                targetY = pAboveBlock.y + (pBlock.y - pAboveBlock.y) * p;
                instructionText = '> ACT: ALIGNING END-EFFECTOR';
            } else if (cycle < 140) {
                targetX = pBlock.x; targetY = pBlock.y;
                clawOpen = 1 - (cycle - 120) / 20;
                instructionText = '> ACT: GRASP';
            } else if (cycle < 180) {
                holding = true; clawOpen = 0;
                let p = easeInOutCubic((cycle - 140) / 40);
                targetX = pBlock.x + (pAboveBlock.x - pBlock.x) * p;
                targetY = pBlock.y + (pAboveBlock.y - pBlock.y) * p;
                instructionText = '> ACT: LIFT OBJECT';
            } else if (cycle < 250) {
                holding = true; clawOpen = 0;
                let p = easeInOutCubic((cycle - 180) / 70);
                targetX = pAboveBlock.x + (pAboveDrop.x - pAboveBlock.x) * p;
                targetY = pAboveBlock.y + (pAboveDrop.y - pAboveBlock.y) * p;
                instructionText = '> VLA: NAVIGATE TO ZONE_A';
            } else if (cycle < 280) {
                holding = true; clawOpen = 0;
                let p = easeInOutCubic((cycle - 250) / 30);
                targetX = pAboveDrop.x;
                targetY = pAboveDrop.y + (pDrop.y - pAboveDrop.y) * p;
                instructionText = '> ACT: LOWER PAYLOAD';
            } else if (cycle < 300) {
                targetX = pDrop.x; targetY = pDrop.y;
                holding = false; blockX = pDrop.x - 5;
                clawOpen = (cycle - 280) / 20;
                instructionText = '> ACT: RELEASE';
            } else if (cycle < 340) {
                targetX = pAboveDrop.x;
                let p = easeInOutCubic((cycle - 300) / 40);
                targetY = pDrop.y + (pAboveDrop.y - pDrop.y) * p;
                blockX = pDrop.x - 5;
                instructionText = '> SYS: TASK_SUCCESS';
            } else if (cycle < 400) {
                let p = easeInOutCubic((cycle - 340) / 60);
                targetX = pAboveDrop.x + (pIdle.x - pAboveDrop.x) * p;
                targetY = pAboveDrop.y + (pIdle.y - pAboveDrop.y) * p;
                blockX = pDrop.x - 5;
                if (cycle > 390) blockX = -999;
                instructionText = '> SYS: RETURNING TO HOME';
            } else {
                targetX = pIdle.x; targetY = pIdle.y;
                if (cycle > 450) blockX = pBlock.x - 5;
                else blockX = -999;
                instructionText = '> SYS: STANDBY';
            }

            if (!holding && blockX > 0) {
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(blockX, blockY + 8, 10, 2);
                ctx.fillStyle = C_BLOCK;
                ctx.fillRect(blockX, blockY - 2, 10, 10);
                ctx.fillStyle = C_BLOCK_HL;
                ctx.fillRect(blockX, blockY - 2, 10, 2);
                ctx.fillRect(blockX, blockY, 2, 8);
                ctx.fillStyle = C_BLOCK_SH;
                ctx.fillRect(blockX + 8, blockY, 2, 8);
            }

            let pose = solveIK(targetX, targetY);

            ctx.fillStyle = 'rgba(0,0,0,0.8)';
            ctx.fillRect(BASE_X - 16, BASE_Y + 2, 32, 4);
            ctx.fillStyle = C_BASE_1;
            ctx.beginPath();
            ctx.moveTo(BASE_X - 14, BASE_Y + 4); ctx.lineTo(BASE_X + 14, BASE_Y + 4);
            ctx.lineTo(BASE_X + 10, BASE_Y - 4); ctx.lineTo(BASE_X - 10, BASE_Y - 4);
            ctx.fill();
            ctx.fillStyle = C_BASE_2;
            ctx.fillRect(BASE_X - 8, BASE_Y - 10, 16, 8);

            ctx.fillStyle = (Math.floor(time / 15) % 2 === 0 || cycle > 300) ? '#00FF00' : '#005500';
            ctx.fillRect(BASE_X - 5, BASE_Y - 8, 2, 2);

            drawSegment(BASE_X, BASE_Y - 6, pose.j1x, pose.j1y);
            drawSegment(pose.j1x, pose.j1y, pose.j2x, pose.j2y);
            drawJoint(BASE_X, BASE_Y - 6, 8);
            drawJoint(pose.j1x, pose.j1y, 6);

            let cx = pose.j2x, cy = pose.j2y;
            ctx.save();
            ctx.translate(cx, cy);

            ctx.fillStyle = C_BASE_1; ctx.fillRect(-3, -3, 6, 6);
            ctx.fillStyle = C_JOINT; ctx.fillRect(-1, -1, 2, 2);
            ctx.fillStyle = C_BASE_2; ctx.fillRect(-6, 2, 12, 4);

            let openAmt = clawOpen * 4;
            ctx.fillStyle = C_ARM; ctx.fillRect(-6 - openAmt, 6, 3, 6);
            ctx.fillStyle = C_ARM_SH; ctx.fillRect(-4 - openAmt, 6, 1, 6);
            ctx.fillStyle = C_ARM; ctx.fillRect(3 + openAmt, 6, 3, 6);
            ctx.fillStyle = C_ARM_SH; ctx.fillRect(3 + openAmt, 6, 1, 6);

            if (holding) {
                ctx.fillStyle = C_BLOCK; ctx.fillRect(-5, 8, 10, 10);
                ctx.fillStyle = C_BLOCK_HL; ctx.fillRect(-5, 8, 10, 2); ctx.fillRect(-5, 10, 2, 8);
                ctx.fillStyle = C_BLOCK_SH; ctx.fillRect(3, 10, 2, 8);
            }
            ctx.restore();

            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, 128, 14);
            ctx.fillStyle = C_VLA_TEXT;
            ctx.font = '8px "Courier New", monospace';
            ctx.fillText(instructionText, 4, 10);
        }

        function animate() { time++; drawFrame(time); requestAnimationFrame(animate); }
        animate();
    </script>
