<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>currated_projects</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --rosewater: #dc8a78;
                --flamingo: #dd7878;
                --pink: #ea76cb;
                --mauve: #8839ef;
                --red: #d20f39;
                --maroon: #e64553;
                --peach: #fe640b;
                --yellow: #df8e1d;
                --green: #40a02b;
                --teal: #179299;
                --sky: #04a5e5;
                --sapphire: #209fb5;
                --blue: #1e66f5;
                --lavender: #7287fd;
                --text: #4c4f69;
                --subtext1: #5c5f77;
                --subtext0: #6c6f85;
                --overlay2: #7c7f93;
                --overlay1: #8c8fa1;
                --overlay0: #9ca0b0;
                --surface2: #acb0be;
                --surface1: #bcc0cc;
                --surface0: #ccd0da;
                --base: #eff1f5;
                --mantle: #e6e9ef;
                --crust: #dce0e8;
            }
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            html {
                scrollbar-width: none;
                cursor:
                    url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='22' fill='none' stroke='%234c4f69' stroke-width='2' stroke-linecap='round'><line x1='8' y1='1' x2='8' y2='8'/><line x1='3' y1='8' x2='13' y2='8'/><line x1='3' y1='8' x2='3' y2='16'/><line x1='13' y1='8' x2='13' y2='16'/></svg>")
                        8 14,
                    auto;
            }
            html::-webkit-scrollbar {
                display: none;
            }
            a,
            button,
            summary {
                cursor:
                    url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='22' fill='none' stroke='%234c4f69' stroke-width='2' stroke-linecap='round'><line x1='8' y1='1' x2='8' y2='8'/><line x1='5' y1='8' x2='11' y2='8'/><line x1='5' y1='8' x2='5' y2='16'/><line x1='11' y1='8' x2='11' y2='16'/></svg>")
                        8 14,
                    pointer;
            }
            body {
                background: var(--base);
                color: var(--text);
                font-family: "JetBrains Mono", monospace;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }
            nav {
                height: 36px;
                background: var(--crust);
                border-bottom: 1px solid var(--surface0);
                display: flex;
                align-items: stretch;
                padding: 0 16px;
                font-size: 13px;
                flex-shrink: 0;
            }
            nav a {
                display: flex;
                align-items: center;
                padding: 0 16px;
                color: var(--subtext0);
                text-decoration: none;
                transition:
                    color 0.15s,
                    background 0.15s;
            }
            nav a:hover {
                color: var(--text);
                background: var(--surface0);
            }
            nav a.active {
                color: var(--text);
                background: var(--base);
                border-bottom: 1px solid var(--base);
                margin-bottom: -1px;
            }
            .content {
                flex: 1;
                max-width: 960px;
                width: 100%;
                margin: 0 auto;
                padding: 24px;
            }
            .path-bar {
                background: var(--mantle);
                border-bottom: 1px solid var(--surface0);
                padding: 8px 16px;
                font-size: 13px;
                color: var(--subtext1);
            }
            .path-bar span {
                color: var(--blue);
            }
            .toolbar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 20px;
            }
            .toolbar .path {
                font-size: 13px;
                color: var(--subtext1);
            }
            .toolbar .path span {
                color: var(--blue);
            }
            .toolbar .count {
                font-size: 12px;
                color: var(--subtext0);
            }
            .grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
                gap: 16px;
            }
            .card {
                background: var(--mantle);
                border: 1px solid var(--surface0);
                border-radius: 6px;
                overflow: hidden;
                text-decoration: none;
                color: inherit;
                display: block;
                transition:
                    transform 0.15s,
                    border-color 0.15s,
                    box-shadow 0.15s;
            }
            .card:hover {
                transform: translateY(-2px);
                border-color: var(--surface2);
                box-shadow: 0 4px 12px rgba(76, 79, 105, 0.08);
            }
            .card .thumb {
                width: 100%;
                aspect-ratio: 16 / 10;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 2rem;
                opacity: 0.6;
            }
            .card .info {
                padding: 10px 12px;
            }
            .card .title {
                font-size: 13px;
                font-weight: 500;
                color: var(--text);
            }
            .card .desc {
                font-size: 11px;
                color: var(--subtext0);
                margin-top: 4px;
                line-height: 1.4;
            }
            .back-row {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 8px 12px;
                margin-bottom: 16px;
                font-size: 13px;
                border: 1px solid var(--surface0);
                border-radius: 6px;
                background: var(--mantle);
                color: var(--blue);
                text-decoration: none;
                transition: background 0.15s;
            }
            .back-row:hover {
                background: var(--crust);
            }
            .path-bar a {
                color: var(--blue);
                text-decoration: none;
            }
            .path-bar a:hover {
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <nav>
            <a href="index.html">~</a>
            <a href="blog.html">blog</a>
            <a href="background.html">background</a>
            <a href="projects.html" class="active">projects</a>
        </nav>

        <div class="path-bar" id="path-bar"><span>~</span>/projects/</div>

        <div class="content">
            <div class="toolbar">
                <div></div>
                <div class="count" id="count"></div>
            </div>
            <div id="back"></div>
            <div class="grid" id="grid"></div>
        </div>

        <script>
            const folders = {
                "machine-learning": {
                    emoji: "🧠",
                    color: "var(--mauve)",
                    items: [
                        {
                            name: "brain-to-text",
                            desc: "CNN-Transformer hybrid decoding 512-channel neural spike trains.",
                            href: "https://www.kaggle.com/code/guegathe/eeg-conformer",
                            emoji: "🧠",
                            color: "var(--mauve)",
                        },
                        {
                            name: "mpc-surrogate",
                            desc: "Neural surrogate models for Model-Predictive-Control. 90% accuracy in MuJoCo.",
                            href: "https://github.com/theguega/mpc_neural_surrogate",
                            emoji: "🎯",
                            color: "var(--blue)",
                        },
                    ],
                },
                oss: {
                    emoji: "🔓",
                    color: "var(--green)",
                    items: [
                        {
                            name: "mixflow",
                            desc: "Custom YouTube frontend. Because existing ones weren't good enough.",
                            href: "https://mixflow.vercel.app/",
                            emoji: "🎵",
                            color: "var(--red)",
                        },
                        {
                            name: "contextpack-md",
                            desc: "A dead-simple tool to extract high-quality Markdown from any URL or PDF.",
                            href: "https://theguega.github.io/contextpack-md/",
                            emoji: "📦",
                            color: "var(--green)",
                        },
                    ],
                },
                robotics: {
                    emoji: "🤖",
                    color: "var(--teal)",
                    items: [
                        {
                            name: "drone-coordination",
                            desc: "Multi-drone autonomous following with MAVSDK and Parrot Olympe.",
                            href: "https://github.com/theguega/drone-coordination",
                            emoji: "🚁",
                            color: "var(--teal)",
                        },
                        {
                            name: "so-arm-100",
                            desc: "Built my own SO-ARM to run experiments thanks to LeRobot.",
                            href: "https://github.com/huggingface/lerobot",
                            emoji: "🦾",
                            color: "var(--sapphire)",
                        },
                        {
                            name: "reachy-chef",
                            desc: "A cooking assistant with sign language for deaf users.",
                            href: "https://pollen-robotics-reachy-mini.hf.space/",
                            emoji: "👨‍🍳",
                            color: "var(--yellow)",
                        },
                        {
                            name: "uni-control",
                            desc: "A decision-control framework with homogeneous control law.",
                            href: "https://github.com/theguega/decision-control-navigation",
                            emoji: "🎮",
                            color: "var(--lavender)",
                        },
                    ],
                },
                software: {
                    emoji: "💻",
                    color: "var(--peach)",
                    items: [
                        {
                            name: "peillute",
                            desc: "Distributed P2P payment app in Rust with Dioxus. No central server.",
                            href: "https://github.com/theguega/peillute",
                            emoji: "💸",
                            color: "var(--peach)",
                        },
                    ],
                },
            };

            const grid = document.getElementById("grid");
            const back = document.getElementById("back");
            const count = document.getElementById("count");
            const pathBar = document.getElementById("path-bar");

            function render(folder) {
                grid.innerHTML = "";
                if (!folder) {
                    back.innerHTML = "";
                    pathBar.innerHTML = "<span>~</span>/projects/";
                    const names = Object.keys(folders);
                    count.textContent = names.length + " items";
                    names.forEach((name) => {
                        const f = folders[name];
                        const card = document.createElement("div");
                        card.className = "card";
                        card.style.cursor = "pointer";
                        card.innerHTML = `
                            <div class="thumb" style="background:${f.color}">${f.emoji}</div>
                            <div class="info">
                                <div class="title">${name}/</div>
                                <div class="desc">${f.items.length} project${f.items.length > 1 ? "s" : ""}</div>
                            </div>`;
                        card.addEventListener("click", () => render(name));
                        grid.appendChild(card);
                    });
                } else {
                    const f = folders[folder];
                    pathBar.innerHTML =
                        '<span>~</span>/projects/<a href="#" onclick="render(); return false;">..</a>/' +
                        folder +
                        "/";
                    count.textContent = f.items.length + " items";
                    back.innerHTML =
                        '<a class="back-row" href="#" onclick="render(); return false;">..</a>';
                    f.items.forEach((p) => {
                        const a = document.createElement("a");
                        a.className = "card";
                        a.href = p.href;
                        a.target = "_blank";
                        a.innerHTML = `
                            <div class="thumb" style="background:${p.color}">${p.emoji}</div>
                            <div class="info">
                                <div class="title">${p.name}</div>
                                <div class="desc">${p.desc}</div>
                            </div>`;
                        grid.appendChild(a);
                    });
                }
            }

            render();
        </script>
    </body>
</html>
